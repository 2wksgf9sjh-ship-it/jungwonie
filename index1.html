<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>양정원의 아이폰</title>
<style>
:root{--ios-blue:#007aff;--ios-green:#34c759;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{min-height:100dvh;background:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Apple SD Gothic Neo",sans-serif;display:grid;place-items:center;color:#000}
button,input{font:inherit}
button{touch-action:manipulation}
.phone-frame{width:min(412px,100vw);height:min(869px,100dvh);background:#000;position:relative;overflow:hidden;box-shadow:0 0 50px rgba(0,0,0,.8)}
@media(min-width:500px){.phone-frame{border-radius:50px;border:10px solid #2d2d2d;height:min(840px,98dvh)}}
.screen{width:100%;height:100%;position:relative;overflow:hidden;background:#000}
.status-bar{position:absolute;top:0;left:0;right:0;height:48px;padding:calc(10px + var(--safe-top)) 24px 0;display:flex;justify-content:space-between;align-items:flex-start;font-size:13px;font-weight:650;z-index:100;pointer-events:none;color:#fff}
.status-left,.status-right{display:flex;align-items:center;gap:6px}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:120px;height:30px;background:#000;border-radius:20px;z-index:101;pointer-events:none}
.view{position:absolute;inset:0;display:none;flex-direction:column;z-index:10}
.view.active{display:flex}
.pass-view{background:rgba(235,235,240,.98);padding:85px 25px calc(30px + var(--safe-bottom));text-align:center;color:#000;z-index:20}
.pass-title{font-size:21px;font-weight:600;margin-bottom:6px}.pass-sub{font-size:13px;color:#666;margin-bottom:25px}
.pass-dots{display:flex;justify-content:center;gap:16px;margin-bottom:35px}
.pass-dot{width:13px;height:13px;border:1.5px solid #000;border-radius:50%}.pass-dot.filled{background:#000}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 20px;max-width:280px;margin:0 auto;position:relative;z-index:30}
.key-btn{width:72px;height:72px;border-radius:50%;background:#fff;border:0;font-size:28px;font-weight:400;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer;color:#000}
.key-btn:active{background:#d1d1d6}.key-sub{font-size:9px;font-weight:700;color:#888;margin-top:-3px}
.pass-error{height:18px;margin-top:15px;color:#d12b2b;font-size:12px}
.home-view{background:linear-gradient(160deg,#1e293b 0%,#334155 50%,#475569 100%);padding:65px 20px calc(30px + var(--safe-bottom));justify-content:space-between}
.grid-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 12px}
.app-item{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-size:11px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.5);cursor:pointer;min-width:0}
.app-icon{width:60px;height:60px;border-radius:15px;overflow:visible;box-shadow:0 4px 12px rgba(0,0,0,.3);display:grid;place-items:center;position:relative}
.icon-kakao{background:#fee500}.icon-insta{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285aeb 90%)}
.icon-phone,.icon-msg{background:linear-gradient(180deg,#34c759,#28a745)}.icon-photos{background:#fff}.icon-music{background:linear-gradient(180deg,#fa2d48,#fa233b)}
.badge{position:absolute;top:-5px;right:-5px;background:#ff3b30;color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:10px;border:2px solid #fff}
.dock-bar{background:rgba(255,255,255,.35);backdrop-filter:blur(25px);border-radius:32px;padding:12px 10px;display:flex;justify-content:space-around;margin-bottom:2px}
.app-view{background:#fff;z-index:50}
.app-header{height:54px;flex:none;border-bottom:.5px solid #e5e5ea;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 12px 0;background:#f9f9fb}
.back-btn{justify-self:start;color:var(--ios-blue);font-size:16px;font-weight:500;background:none;border:0;display:flex;align-items:center;gap:4px;cursor:pointer;padding:8px 4px}
.app-title-text{font-weight:600;font-size:16px}.header-right{justify-self:end;width:44px}
.app-body{flex:1;min-height:0;overflow-y:auto;background:#fff;overscroll-behavior:contain}
.chat-list-row{display:flex;align-items:center;padding:14px 16px;border-bottom:.5px solid #f0f0f0;gap:12px;cursor:pointer}
.chat-pfp{width:50px;height:50px;border-radius:18px;background:#eee;display:grid;place-items:center;font-size:24px;flex:none}
.chat-info{flex:1;min-width:0}.chat-name{font-weight:700;font-size:15px;margin-bottom:4px}.chat-preview{font-size:13px;color:#8e8e93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-time{font-size:11px;color:#8e8e93}
.chatroom-container{height:100%;min-height:0;display:flex;flex-direction:column;background:#bacee0}
.chat-bubbles{flex:1;min-height:0;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.bubble-msg{max-width:78%;padding:10px 14px;border-radius:16px;background:#fff;font-size:14px;line-height:1.4;align-self:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.08);overflow-wrap:anywhere}
.bubble-msg.me{background:#fee500;align-self:flex-end}
.chat-input-bar{padding:10px;background:#fff;display:flex;gap:8px;align-items:center;border-top:.5px solid #ddd;padding-bottom:calc(10px + var(--safe-bottom))}
.chat-input-bar input{flex:1;min-width:0;border:1px solid #ddd;border-radius:20px;padding:10px 14px;font-size:14px;outline:none;user-select:text}
.chat-input-bar button{background:#fee500;border:0;border-radius:16px;padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer}
.insta-header-bio{padding:16px;border-bottom:.5px solid #dbdbdb}.insta-top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.insta-avatar{width:76px;height:76px;border-radius:50%;border:1px solid #dbdbdb;overflow:hidden;flex:none}
.insta-avatar img{width:100%;height:100%;object-fit:cover}.insta-metrics{display:flex;gap:20px;text-align:center;flex:1;justify-content:space-around}
.insta-metrics b{display:block;font-size:16px;font-weight:700}.insta-metrics span{font-size:12px;color:#666}
.insta-name-text{font-weight:700;font-size:14px}.insta-bio-text{font-size:13px;color:#333;line-height:1.5;margin-top:4px}
.insta-feed-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.insta-grid-item{aspect-ratio:1;background:#eee;overflow:hidden;cursor:pointer}
.insta-grid-item img{width:100%;height:100%;object-fit:cover}
.call-log-item{padding:14px 16px;border-bottom:.5px solid #e5e5ea;display:flex;justify-content:space-between;align-items:center}
.call-name{font-weight:600;font-size:15px}.call-type{font-size:12px;color:#8e8e93;margin-top:2px}.call-status{font-size:12px;color:#8e8e93}.text-red{color:#ff3b30!important}
.message-note{padding:10px 16px;background:#f7f7f7;color:#888;font-size:12px;text-align:center}
.post-wrap{padding:15px}.post-author{display:flex;align-items:center;gap:10px;margin-bottom:12px}.post-author img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.post-image{width:100%;border-radius:12px;display:block}.post-caption{font-size:13px;margin-top:12px;line-height:1.5}
.post-back{border:0;background:#eee;padding:9px 16px;border-radius:10px;margin-top:15px;font-weight:600;cursor:pointer}
.home-indicator{position:absolute;bottom:calc(8px + var(--safe-bottom));left:50%;transform:translateX(-50%);width:134px;height:5px;background:#fff;border-radius:10px;z-index:200;cursor:pointer;mix-blend-mode:difference}
.empty-state{padding:35px 20px;text-align:center;color:#888;font-size:14px}
@media(max-height:650px){.pass-view{padding-top:65px}.pass-dots{margin-bottom:20px}.keypad{gap:9px 16px}.key-btn{width:60px;height:60px}.home-view{padding-top:55px}.grid-apps{gap:14px 10px}}
</style>
</head>
<body>
<div class="phone-frame">
<div class="screen">
<div class="status-bar" id="statusBar"><div class="status-left"><span>KT</span><span>5G</span></div><div class="notch"></div><div class="status-right"><span id="liveTime">09:41</span><span>🔋</span></div></div>

<div class="view pass-view active" id="passView">
  <div class="pass-title">양정원님의 iPhone</div>
  <div class="pass-sub">암호 입력 (0209)</div>
  <div class="pass-dots"><div class="pass-dot" id="dot0"></div><div class="pass-dot" id="dot1"></div><div class="pass-dot" id="dot2"></div><div class="pass-dot" id="dot3"></div></div>
  <div class="keypad">
    <button class="key-btn" type="button" onclick="pressKey('1')">1<span class="key-sub">&nbsp;</span></button>
    <button class="key-btn" type="button" onclick="pressKey('2')">2<span class="key-sub">ABC</span></button>
    <button class="key-btn" type="button" onclick="pressKey('3')">3<span class="key-sub">DEF</span></button>
    <button class="key-btn" type="button" onclick="pressKey('4')">4<span class="key-sub">GHI</span></button>
    <button class="key-btn" type="button" onclick="pressKey('5')">5<span class="key-sub">JKL</span></button>
    <button class="key-btn" type="button" onclick="pressKey('6')">6<span class="key-sub">MNO</span></button>
    <button class="key-btn" type="button" onclick="pressKey('7')">7<span class="key-sub">PQRS</span></button>
    <button class="key-btn" type="button" onclick="pressKey('8')">8<span class="key-sub">TUV</span></button>
    <button class="key-btn" type="button" onclick="pressKey('9')">9<span class="key-sub">WXYZ</span></button>
    <button class="key-btn" style="visibility:hidden" aria-hidden="true"></button>
    <button class="key-btn" type="button" onclick="pressKey('0')">0<span class="key-sub">+</span></button>
    <button class="key-btn" type="button" style="font-size:14px;font-weight:600" onclick="clearPass()">지우기</button>
  </div>
  <div class="pass-error" id="passError" aria-live="polite"></div>
</div>

<div class="view home-view" id="homeView">
  <div class="grid-apps">
    <div class="app-item" onclick="openApp('kakao')"><div class="app-icon icon-kakao"><svg width="38" height="38" viewBox="0 0 100 100"><path d="M50 15C27.9 15 10 28.4 10 45c0 10.7 7.4 20.1 18.6 25.5l-4.7 17.2c-.3 1.1.9 2 1.8 1.4l20.2-13.4c1.3.1 2.7.2 4.1.2 22.1 0 40-13.4 40-30S72.1 15 50 15z" fill="#3c1e1e"/><text x="50" y="52" font-size="20" font-weight="900" fill="#fee500" text-anchor="middle">TALK</text></svg><span class="badge">2</span></div>카카오톡</div>
    <div class="app-item" onclick="openApp('insta')"><div class="app-icon icon-insta"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></div>Instagram</div>
    <div class="app-item" onclick="showNotice('사진첩 앱입니다.')"><div class="app-icon icon-photos"><svg width="32" height="32" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" fill="#ff2d55" opacity=".8"/><circle cx="12" cy="8" r="5" fill="#ff9500" opacity=".8"/><circle cx="16" cy="12" r="5" fill="#4cd964" opacity=".8"/></svg></div>사진</div>
    <div class="app-item" onclick="showNotice('음악 플레이어입니다.')"><div class="app-icon icon-music"><svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></div>음악</div>
  </div>
  <div class="dock-bar">
    <div class="app-item" onclick="openApp('calls')"><div class="app-icon icon-phone" style="width:54px;height:54px"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></div></div>
    <div class="app-item" onclick="openApp('kakao')"><div class="app-icon icon-kakao" style="width:54px;height:54px"><svg width="34" height="34" viewBox="0 0 100 100"><path d="M50 15C27.9 15 10 28.4 10 45c0 10.7 7.4 20.1 18.6 25.5l-4.7 17.2c-.3 1.1.9 2 1.8 1.4l20.2-13.4c1.3.1 2.7.2 4.1.2 22.1 0 40-13.4 40-30S72.1 15 50 15z" fill="#3c1e1e"/><text x="50" y="52" font-size="20" font-weight="900" fill="#fee500" text-anchor="middle">TALK</text></svg></div></div>
    <div class="app-item" onclick="openApp('insta')"><div class="app-icon icon-insta" style="width:54px;height:54px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/></svg></div></div>
    <div class="app-item" onclick="openApp('messages')"><div class="app-icon icon-msg" style="width:54px;height:54px"><svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></div></div>
  </div>
</div>

<div class="view app-view" id="appView">
  <div class="app-header"><button class="back-btn" id="backButton" type="button" onclick="handleBack()">‹ 홈</button><span class="app-title-text" id="appTitle">앱 이름</span><span class="header-right"></span></div>
  <div class="app-body" id="appBody"></div>
</div>
<div class="home-indicator" id="homeIndicator" onclick="goHome()" aria-label="홈으로"></div>
</div>
</div>

<script>
'use strict';
const jungwonPhotos=[
  "https://i.postimg.cc/85zC6X1L/image-4.png",
  "https://i.postimg.cc/P5pM1W2y/image-5.png",
  "https://i.postimg.cc/prgQd8jS/image-6.png"
];
let jongseongChat=[{sender:'박종성',text:'여주랑 헤어졌어? 여주 다른 애랑 밥 같이 먹던데'}];
let sunwooChat=[
  {sender:'김선우',text:'너 여자애들이랑 술 마셔도 돼? 여주가 뭐라 안하고?'},
  {sender:'나',text:'괜찮아요. 여주 누나 착해서 ㅋㅋ'},
  {sender:'김선우',text:'헐..'}
];
let enteredPass='';
const correctPass='0209';
let currentApp='';
let currentChat='';
let previousScreen='list';

function updateClock(){
  const d=new Date();
  document.getElementById('liveTime').textContent=
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
updateClock();
setInterval(updateClock,30000);

function pressKey(num){
  if(enteredPass.length>=4)return;
  document.getElementById('passError').textContent='';
  enteredPass+=String(num);
  renderPassDots();
  if(enteredPass.length===4){
    if(enteredPass===correctPass){
      setTimeout(()=>{enteredPass='';renderPassDots();switchView('homeView');},120);
    }else{
      document.getElementById('passError').textContent='암호가 올바르지 않습니다.';
      setTimeout(clearPass,650);
    }
  }
}
function clearPass(){enteredPass='';renderPassDots();document.getElementById('passError').textContent='';}
function renderPassDots(){
  for(let i=0;i<4;i++){
    const el=document.getElementById('dot'+i);
    if(el)el.classList.toggle('filled',i<enteredPass.length);
  }
}
function switchView(viewId){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const target=document.getElementById(viewId);
  if(target)target.classList.add('active');
  document.getElementById('statusBar').style.color=viewId==='homeView'?'#fff':'#000';
  document.getElementById('homeIndicator').style.background=viewId==='homeView'?'#fff':'#000';
}
function goHome(){currentApp='';currentChat='';switchView('homeView');}
function showNotice(message){alert(message);}
function setHeader(title,backText='‹ 홈'){
  document.getElementById('appTitle').textContent=title;
  document.getElementById('backButton').textContent=backText;
}
function openApp(appKey){
  currentApp=appKey;currentChat='';previousScreen='list';
  switchView('appView');
  const body=document.getElementById('appBody');
  if(appKey==='kakao'){setHeader('카카오톡');renderKakaoList();}
  else if(appKey==='insta'){setHeader('Instagram');renderInstagram();}
  else if(appKey==='calls'){setHeader('최근 통화');renderCalls();}
  else if(appKey==='messages'){setHeader('메시지');renderMessages();}
}
function renderKakaoList(){
  const body=document.getElementById('appBody');
  const lastJ=jongseongChat[jongseongChat.length-1]?.text||'대화가 없습니다.';
  const lastS=sunwooChat[sunwooChat.length-1]?.text||'대화가 없습니다.';
  body.innerHTML=
    `<div class="chat-list-row" onclick="openChatRoom('박종성')"><div class="chat-pfp">🦅</div><div class="chat-info"><div class="chat-name">박종성 선배</div><div class="chat-preview">${escapeHTML(lastJ)}</div></div><div class="chat-time">방금</div></div>`+
    `<div class="chat-list-row" onclick="openChatRoom('김선우')"><div class="chat-pfp">🦊</div><div class="chat-info"><div class="chat-name">김선우</div><div class="chat-preview">${escapeHTML(lastS)}</div></div><div class="chat-time">오후 2:15</div></div>`+
    `<div class="chat-list-row" onclick="openChatRoom('박여주')"><div class="chat-pfp">❤️</div><div class="chat-info"><div class="chat-name">박여주</div><div class="chat-preview">우리 헤어져.</div></div><div class="chat-time">어제</div></div>`;
}
function openChatRoom(name){
  currentChat=name;previousScreen='list';setHeader(name,'‹ 카카오톡');
  const body=document.getElementById('appBody');
  let data=name==='박종성'?jongseongChat:name==='김선우'?sunwooChat:null;
  if(data){
    const bubbles=data.map(c=>`<div class="bubble-msg ${c.sender==='나'?'me':''}">${escapeHTML(c.text)}</div>`).join('');
    body.innerHTML=`<div class="chatroom-container"><div class="chat-bubbles" id="chatBubblesBox">${bubbles}</div><div class="chat-input-bar"><input type="text" id="chatInput" placeholder="메시지 입력..." autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();sendChatMsg('${name}')}"><button type="button" onclick="sendChatMsg('${name}')">전송</button></div></div>`;
    scrollChatToBottom();
  }else{
    body.innerHTML=`<div class="chatroom-container"><div class="chat-bubbles"><div class="bubble-msg">우리 헤어져.</div><div class="bubble-msg me">여주야 잠시만 내 말 좀 들어줘</div><div class="bubble-msg me">전화 좀 받아주라 제발</div></div><div class="chat-input-bar"><input type="text" placeholder="전송할 수 없습니다." disabled style="background:#eee"></div></div>`;
  }
}
function scrollChatToBottom(){
  const box=document.getElementById('chatBubblesBox');
  if(box)box.scrollTop=box.scrollHeight;
}
function sendChatMsg(name){
  const input=document.getElementById('chatInput');
  if(!input)return;
  const val=input.value.trim();
  if(!val)return;
  const data=name==='박종성'?jongseongChat:sunwooChat;
  data.push({sender:'나',text:val});
  openChatRoom(name);
  if(name==='박종성'&&val.replace(/\s+/g,'')==='아니요그냥싸웠어요'){
    setTimeout(()=>{
      jongseongChat.push({sender:'박종성',text:'아 그렇지?ㅋㅋㅋ 싸우지 마라'});
      if(currentApp==='kakao'&&currentChat==='박종성')openChatRoom('박종성');
    },900);
  }
}
function renderInstagram(){
  const body=document.getElementById('appBody');
  body.innerHTML=
    `<div class="insta-header-bio"><div class="insta-top-row"><div class="insta-avatar"><img src="${jungwonPhotos[0]}" alt="양정원 프로필" onerror="this.style.opacity='.2'"></div><div class="insta-metrics"><div><b>3</b><span>게시물</span></div><div><b>210</b><span>팔로워</span></div><div><b>3</b><span>팔로잉</span></div></div></div><div class="insta-name-text">양정원</div><div class="insta-bio-text">21 | 대학교 과대 🐱<br><span style="color:#8e8e93;font-size:12px">팔로잉: 박여주, 김선우, 박종성</span></div></div>`+
    `<div class="insta-feed-grid">${jungwonPhotos.map((url,i)=>`<div class="insta-grid-item" onclick="viewPhotoDetail(${i+1})"><img src="${url}" alt="게시물 ${i+1}" loading="lazy"></div>`).join('')}</div>`;
}
function viewPhotoDetail(idx){
  const body=document.getElementById('appBody');
  previousScreen='insta';setHeader('게시물','‹ Instagram');
  body.innerHTML=`<div class="post-wrap"><div class="post-author"><img src="${jungwonPhotos[0]}" alt=""><b style="font-size:14px">양정원</b></div><img class="post-image" src="${jungwonPhotos[idx-1]}" alt="양정원 게시물"><div class="post-caption"><b>양정원</b> 정원이의 일상 🐱</div><button class="post-back" type="button" onclick="renderInstagram();setHeader('Instagram')">← 돌아가기</button></div>`;
}
function renderCalls(){
  document.getElementById('appBody').innerHTML=
    `<div class="call-log-item"><div><div class="call-name text-red">❤️ 박여주</div><div class="call-type">휴대폰</div></div><div class="call-status text-red">수신 취소 (3)</div></div>`+
    `<div class="call-log-item"><div><div class="call-name text-red">❤️ 박여주</div><div class="call-type">휴대폰</div></div><div class="call-status text-red">부재중 전화</div></div>`+
    `<div class="call-log-item"><div><div class="call-name">🦅 박종성 선배</div><div class="call-type">휴대폰</div></div><div class="call-status">발신 통화 · 2분</div></div>`+
    `<div class="call-log-item"><div><div class="call-name">🦊 김선우</div><div class="call-type">휴대폰</div></div><div class="call-status">수신 통화 · 5분</div></div>`;
}
function renderMessages(){
  document.getElementById('appBody').innerHTML=
    `<div class="chat-list-row"><div class="chat-pfp">📢</div><div class="chat-info"><div class="chat-name">[과대 공지] 학과 총회</div><div class="chat-preview">내일 오후 6시 정문 앞 카페 모임 관련...</div></div><div class="chat-time">오전 10:30</div></div><div class="message-note">메시지 미리보기</div>`;
}
function handleBack(){
  if(currentApp==='kakao'&&currentChat){currentChat='';setHeader('카카오톡','‹ 홈');renderKakaoList();return;}
  if(currentApp==='insta'&&document.getElementById('appTitle').textContent==='게시물'){renderInstagram();setHeader('Instagram','‹ 홈');return;}
  goHome();
}
function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
</script>
</body>
</html>
